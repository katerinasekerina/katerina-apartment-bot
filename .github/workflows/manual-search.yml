name: Manual apartment search

on:
  workflow_dispatch:
    inputs:
      district:
        description: Tbilisi district key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-apartment-search-${{ inputs.district }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python package
        run: python -m pip install --no-cache-dir -r requirements-cloud.txt

      - name: Search selected district and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_DISTRICT: ${{ inputs.district }}
          MANUAL_LIMIT: "30"
        run: python manual_search_router.py
