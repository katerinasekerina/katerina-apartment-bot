name: Diagnose owner phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python package
        run: python -m pip install --no-cache-dir -r requirements-cloud.txt

      - name: Run owner phone diagnostics
        run: python diagnose_owner_phone.py

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-phone-diagnostics
          path: phone_diagnostics/
          if-no-files-found: warn
          retention-days: 7
