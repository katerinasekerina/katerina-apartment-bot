name: Apply owner phone fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Apply phone fix
        run: python apply_owner_phone_fix.py

      - name: Commit fixed check_once.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check_once.py
          git diff --cached --quiet || git commit -m "Fix owner phone matching from masked numbers"
          git push
